<!DOCTYPE html>
<html lang="pt-BR">
<head><script src="https://myhub.ia.br/canvas-vendor/tailwind.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
*{box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{background:#f0f2f5;margin:0;padding:20px}
.wrap{max-width:1000px;margin:0 auto;background:#fff;border-radius:10px;box-shadow:0 4px 15px rgba(0,0,0,.08);padding:22px}
h2{margin:0 0 14px;color:#1f2937;border-bottom:2px solid #e5e7eb;padding-bottom:10px}
#busca{width:100%;padding:14px;font-size:16px;border:2px solid #cbd5e1;border-radius:8px;outline:none}
#busca:focus{border-color:#2563eb}
.bar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin:12px 0}
.chips button{border:1px solid #cbd5e1;background:#fff;padding:7px 14px;border-radius:20px;cursor:pointer;font-weight:600;font-size:13px;color:#334155}
.chips button.on{background:#0f172a;color:#fff;border-color:#0f172a}
.chips button.fok.on{background:#10b981;border-color:#10b981}
.chips button.fbad.on{background:#ef4444;border-color:#ef4444}
#cont{font-size:13px;color:#64748b;font-weight:600}
#detalhe{display:none;padding:18px;border-radius:8px;border-left:8px solid;margin-bottom:14px}
#detalhe.ok{display:block;background:#ecfdf5;border-color:#10b981}
#detalhe.bad{display:block;background:#fef2f2;border-color:#ef4444}
.ph{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;border-bottom:1px dashed rgba(0,0,0,.15);padding-bottom:10px;margin-bottom:10px}
.cod{display:inline-block;background:#0f172a;color:#f8fafc;font-size:13px;font-weight:700;padding:4px 10px;border-radius:6px;margin-bottom:6px}
.dsc{font-size:19px;font-weight:700;color:#1e293b;margin:0}
.badge{padding:8px 18px;border-radius:20px;font-weight:700;color:#fff;white-space:nowrap}
.b-ok{background:#10b981}.b-bad{background:#ef4444}
.msg{font-weight:700;margin-bottom:10px}
.msg.ok{color:#047857}.msg.bad{color:#b91c1c}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.it{background:#fff;padding:10px;border-radius:6px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.lb{font-size:12px;color:#64748b;font-weight:600;text-transform:uppercase}
.vl{font-size:18px;font-weight:700;color:#0f172a;margin-top:3px}
.tbox{max-height:480px;overflow:auto;border:1px solid #e5e7eb;border-radius:8px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{position:sticky;top:0;background:#1e293b;color:#fff;text-align:left;padding:10px;z-index:1}
td{padding:8px 10px;border-bottom:1px solid #eef0f3}
tbody tr{cursor:pointer}
tbody tr:hover{background:#eff6ff}
tbody tr.sel{background:#dbeafe}
.r{text-align:right;white-space:nowrap}
.st{display:inline-block;padding:3px 10px;border-radius:12px;font-size:12px;font-weight:700;color:#fff}
.vazio{padding:20px;text-align:center;color:#64748b}
</style>
</head>
<body>
<div class="wrap">
  <h2>Validador de Margem para Transferência SC x SP</h2>
  <input id="busca" type="text" placeholder="Digite o código ou a descrição do produto..." autocomplete="off">

  <div class="bar">
    <div class="chips">
      <button class="on" data-f="T">Todos</button>
      <button class="fok" data-f="OK">OK</button>
      <button class="fbad" data-f="BAD">Péssimo</button>
    </div>
    <span id="cont"></span>
  </div>

  <div id="detalhe">
    <div class="ph">
      <div><span class="cod" id="dCod"></span><h3 class="dsc" id="dDesc"></h3></div>
      <span class="badge" id="dBadge"></span>
    </div>
    <div class="msg" id="dMsg"></div>
    <div class="grid">
      <div class="it"><div class="lb">Custo Final</div><div class="vl" id="dCusto"></div></div>
      <div class="it"><div class="lb">Preço Tabela</div><div class="vl" id="dTab"></div></div>
      <div class="it"><div class="lb">Rentabilidade</div><div class="vl" id="dRent"></div></div>
    </div>
  </div>

  <div class="tbox">
    <table>
      <thead><tr><th>Código</th><th>Descrição</th><th class="r">Custo Final</th><th class="r">Preço Tabela</th><th class="r">Rentab.</th><th>Status</th></tr></thead>
      <tbody id="corpo"></tbody>
    </table>
  </div>
</div>

const META = 12;
const dados = RAW.split("\n").map(l => {
  const p = l.split(";");
  return { cod: p[0], desc: p[1], custo: +p[2], tab: +p[3], rent: +p[4] };
});

const moeda = v => v.toLocaleString("pt-BR", {style:"currency", currency:"BRL"});
const ok = d => d.rent >= META;
let filtro = "T", selecionado = null;

function render() {
  const t = document.getElementById("busca").value.trim().toLowerCase();
  const lista = dados.filter(d => {
    if (filtro === "OK" && !ok(d)) return false;
    if (filtro === "BAD" && ok(d)) return false;
    return !t || d.cod.includes(t) || d.desc.toLowerCase().includes(t);
  });
  document.getElementById("cont").textContent = lista.length + " de " + dados.length + " produtos";
  const corpo = document.getElementById("corpo");
  if (!lista.length) {
    corpo.innerHTML = '<tr><td colspan="6" class="vazio">Nenhum produto encontrado.</td></tr>';
    return;
  }
  corpo.innerHTML = lista.map(d => {
    const o = ok(d);
    return '<tr data-c="' + d.cod + '" class="' + (d.cod === selecionado ? "sel" : "") + '">' +
      '<td><b>' + d.cod + '</b></td><td>' + d.desc + '</td>' +
      '<td class="r">' + moeda(d.custo) + '</td><td class="r">' + moeda(d.tab) + '</td>' +
      '<td class="r" style="font-weight:700;color:' + (o ? "#047857" : "#b91c1c") + '">' + d.rent.toFixed(0) + '%</td>' +
      '<td><span class="st" style="background:' + (o ? "#10b981" : "#ef4444") + '">' + (o ? "OK" : "PÉSSIMO") + '</span></td></tr>';
  }).join("");
}

function mostrar(cod) {
  const d = dados.find(x => x.cod === cod);
  if (!d) return;
  selecionado = cod;
  const o = ok(d);
  const box = document.getElementById("detalhe");
  box.className = o ? "ok" : "bad";
  document.getElementById("dCod").textContent = "CÓDIGO: " + d.cod;
  document.getElementById("dDesc").textContent = d.desc;
  const b = document.getElementById("dBadge");
  b.className = "badge " + (o ? "b-ok" : "b-bad");
  b.textContent = o ? "OK" : "PÉSSIMO";
  const m = document.getElementById("dMsg");
  m.className = "msg " + (o ? "ok" : "bad");
  m.textContent = o ? "✔ PODE TRANSFERIR (rentabilidade dentro da meta)" : "✖ NÃO PODE TRANSFERIR (rentabilidade abaixo de 12%)";
  document.getElementById("dCusto").textContent = moeda(d.custo);
  document.getElementById("dTab").textContent = moeda(d.tab);
  const r = document.getElementById("dRent");
  r.textContent = d.rent.toFixed(2) + "%";
  r.style.color = o ? "#047857" : "#b91c1c";
  render();
}

document.getElementById("busca").addEventListener("input", () => {
  const t = document.getElementById("busca").value.trim().toLowerCase();
  const exato = dados.find(d => d.cod === t);
  if (exato) mostrar(exato.cod);
  else { selecionado = null; document.getElementById("detalhe").className = ""; render(); }
});

document.getElementById("corpo").addEventListener("click", e => {
  const tr = e.target.closest("tr[data-c]");
  if (tr) mostrar(tr.dataset.c);
});

document.querySelectorAll(".chips button").forEach(b => b.addEventListener("click", () => {
  document.querySelectorAll(".chips button").forEach(x => x.classList.remove("on"));
  b.classList.add("on");
  filtro = b.dataset.f;
  render();
}));

render();
</script>
